modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPL-3.0-only"

[[mods]]
modId = "cc_hse"
version = "${modVersion}"
displayName = "CC: HSE"
description = '''
A high-frequency hardware abstraction layer for CC: Tweaked. Provides the
cc_hse block, which sends hse_tick events to attached computers at a
configurable frequency (higher than the vanilla 20 Hz tick rate), together
with a queue-free waitNextTick() method for waiting on the next tick.
'''

[[dependencies.cc_hse]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.9,21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cc_hse]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.cc_hse]]
modId = "computercraft"
type = "required"
versionRange = "[1.120.0,)"
ordering = "AFTER"
side = "BOTH"
